<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsyth Signal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <div id="header-content">
                <h1>Forsyth Signal</h1>
            </div>
        </header>

        <main id="main">
            <aside id="events-panel">
                <div id="events-header">
                    <h2>Events</h2>
                </div>
                <input id="search" type="search" placeholder="Search events...">
                <div id="events"></div>
            </aside>

            <section id="map-container">
                <div id="map-search">
                    <input id="location-search" type="search" placeholder="Search the map...">
                    <div id="location-results"></div>
                </div>
                <div id="map"></div>
            </section>

            <aside id="details-panel">
                <div id="details-header">
                    <h2>Details</h2>
                </div>

                <div id="details">
                    <p>Select an event</p>
                </div>
            </aside>
        </main>

        <footer id="footer">
            <span>Forsyth Signal</span>
        </footer>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
