<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsyth Signal</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header id="header">
            <div id="header-content">
                <h1>Forsyth Signal</h1>
            </div>
        </header>

        <main id="main">
            <aside id="events-panel">
                <div id="events-header">
                    <h2>Events</h2>
                </div>

                <div id="event-tabs">
                    <button class="event-tab is-active" data-state="upcoming">Upcoming</button>
                    <button class="event-tab" data-state="active">Active</button>
                    <button class="event-tab" data-state="past">Past</button>
                </div>

                <div id="event-filters">
                    <select id="category-filter">
                        <option value="all">All categories</option>
                        <option value="development">Development</option>
                        <option value="government">Government</option>
                        <option value="education">Education</option>
                        <option value="transportation">Transportation</option>
                        <option value="community">Community</option>
                    </select>
                </div>

                <input id="search" type="search" placeholder="Search events...">
                <div id="event-count" role="status" aria-live="polite"></div>
                <div id="events"></div>
            </aside>

            <section id="map-container">
                <div id="map-search">
                    <input id="location-search" type="search" placeholder="Search the map...">
                    <div id="location-results"></div>
                </div>
                <div id="address-panel">
                    <div class="address-heading">What affects me?</div>

                    <div class="address-description">
                        Enter an address to find nearby events,
                        developments, and public meetings.
                    </div>

                    <div class="address-input-row">
                        <input id="address-search" type="search" placeholder="Enter an address...">
                        <button id="address-submit">Find</button>
                    </div>

                    <div id="address-results"></div>
                </div>

                <div id="map"></div>
            </section>

            <aside id="details-panel">
                <div id="details-header">
                    <h2>Details</h2>
                </div>

                <div id="details">
                    <p>Select an event</p>
                </div>
            </aside>
        </main>

        <footer id="footer">
            <span>Forsyth Signal</span>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>

</body>

</html>
