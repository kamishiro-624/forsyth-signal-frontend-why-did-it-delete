<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forsyth Signal</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">FORSYTH <span>SIGNAL</span></div>

        <input id="search" type="search" placeholder="Search for an event...">
    </header>

    <main>
        <aside id="sidebar">
            <h2>What's happening?</h2>

            <div id="events">
            </div>
        </aside>

        <!-- todo :3 -->
        <section id="map">
            <div id="map-search">
                <input id="location-search" type="search" placeholder="Search for a location..." autocomplete="off">
                <div id="location-results"></div>
            </div>

        </section>

        <aside id="details">
            <div class="empty">
                Select something to learn more.
            </div>
        </aside>
    </main>

    <script type="module" src="script.js"></script>

</body>
